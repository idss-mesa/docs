[project]
site_name = "MESA"
site_description = "One-line install of the CyVerse MESA MCP stack (mesa-mcp, mesa-ducklake, irods-mcp-server, formation-mcp) for Claude Code, Codex CLI, Antigravity, and OpenCode."
site_author = "idss-mesa"
site_url = "https://idss-mesa.github.io/mesa/"
repo_url = "https://github.com/idss-mesa/mesa"
repo_name = "idss-mesa/mesa"
copyright = """
Copyright &copy; 2026 The Arizona Board of Regents on behalf of The University of Arizona
"""

# Explicit navigation. Omit this to derive nav from the docs/ tree instead.
nav = [
  { "Home" = "index.md" },
  { "Quickstart" = "quickstart.md" },
  { "Install reference" = "install.md" },
  { "Agent clients" = [
      { "Claude Code" = "claude-code.md" },
      { "Codex CLI" = "codex.md" },
      { "Antigravity" = "antigravity.md" },
      { "OpenCode" = "opencode.md" },
  ] },
  { "Credentials" = "credentials.md" },
  { "Servers" = [
      { "mesa-mcp" = "servers/mesa-mcp.md" },
      { "mesa-ducklake" = "servers/mesa-ducklake.md" },
      { "irods-mcp-server" = "servers/irods-mcp-server.md" },
      { "formation-mcp" = "servers/formation-mcp.md" },
  ] },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Changelog" = "log.md" },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "green"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "green"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/idss-mesa"

# Markdown extensions (Zensical defaults — sensible for technical docs).
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
